<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Order — WYSSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="products" class="is-bento">
    <div class="shell">
      <div data-site-header></div>
      <main id="inhalt" class="page">
        <div class="panel">
          <h1>Quick Order</h1>
          <p class="panel__lede">
            Enter article numbers. Known SKUs fill product and size automatically. Example: WYS-ARC-N-U-014.
          </p>
          <div class="table-scroll">
            <table class="order-table" data-quick-order>
              <thead>
                <tr>
                  <th scope="col">SKU</th>
                  <th scope="col">Product</th>
                  <th scope="col">Size / spec</th>
                  <th scope="col">Qty</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><input data-sku-input type="text" autocomplete="off" spellcheck="false" placeholder="Enter SKU" aria-label="SKU 1" /></td>
                  <td data-qo-product></td>
                  <td data-qo-spec></td>
                  <td><input type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity 1" /></td>
                </tr>
                <tr>
                  <td><input data-sku-input type="text" autocomplete="off" spellcheck="false" placeholder="Enter SKU" aria-label="SKU 2" /></td>
                  <td data-qo-product></td>
                  <td data-qo-spec></td>
                  <td><input type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity 2" /></td>
                </tr>
                <tr>
                  <td><input data-sku-input type="text" autocomplete="off" spellcheck="false" placeholder="Enter SKU" aria-label="SKU 3" /></td>
                  <td data-qo-product></td>
                  <td data-qo-spec></td>
                  <td><input type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity 3" /></td>
                </tr>
                <tr>
                  <td><input data-sku-input type="text" autocomplete="off" spellcheck="false" placeholder="Enter SKU" aria-label="SKU 4" /></td>
                  <td data-qo-product></td>
                  <td data-qo-spec></td>
                  <td><input type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity 4" /></td>
                </tr>
                <tr>
                  <td><input data-sku-input type="text" autocomplete="off" spellcheck="false" placeholder="Enter SKU" aria-label="SKU 5" /></td>
                  <td data-qo-product></td>
                  <td data-qo-spec></td>
                  <td><input type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" aria-label="Quantity 5" /></td>
                </tr>
              </tbody>
            </table>
          </div>
          <p class="notice">No payment is processed on this page. Order requests go to the practice account.</p>
          <p class="notice notice--ok" data-order-ok hidden>Order request captured for this practice session.</p>
          <button class="btn-bento" type="button" data-quick-submit>Submit order <span aria-hidden="true">↗</span></button>
        </div>
      </main>
      <div data-site-footer></div>
    </div>
    <script src="js/catalog.js"></script>
    <script src="js/site.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
